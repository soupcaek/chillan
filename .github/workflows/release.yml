name: Release

# Ny versjon: endre tallet i VERSION-fila (f.eks. 0.2.0) og push til main.
# Da lages taggen v0.2.0, zip-filen bygges, og den legges ut som en
# GitHub-release som WowUp finner automatisk.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Les versjon
        id: v
        run: |
          VERSION="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION finnes allerede – hopper over."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bygg zip
        if: steps.v.outputs.skip != 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          mkdir -p .release/Chillan
          rsync -a --exclude '.git*' --exclude '.github' --exclude '.release' \
            --exclude 'README.md' --exclude 'VERSION' --exclude '.pkgmeta' ./ .release/Chillan/
          sed -i "s/@project-version@/${TAG#v}/" .release/Chillan/*.toc
          cd .release
          ZIP="Chillan-${TAG}-forever.zip"
          zip -r -q "$ZIP" Chillan
          cat > release.json <<JSON
          {"releases":[{"name":"Chillan","version":"${TAG}","filename":"${ZIP}","nolib":false,
            "metadata":[{"flavor":"forever","interface":16001}]}]}
          JSON
          ls -la

      - name: Publiser release
        if: steps.v.outputs.skip != 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" .release/Chillan-${TAG}-forever.zip .release/release.json \
            --title "Chillan? ${TAG}" --notes "Oppdater i WowUp, eller last ned zip-filen og legg mappen Chillan i _forever_\\Interface\\AddOns." \
            --verify-tag
