name: Release

# Nattlig utgivelse: endre tallet i VERSION-fila (f.eks. 0.22.0) og push til main så ofte
# du vil i løpet av dagen. Kl. 03:00 norsk tid sjekker denne jobben om VERSION har en
# release fra før – hvis ikke bygges zip-filen og legges ut som GitHub-release, som
# WowUp finner. Da får gjengen maks én oppdatering i døgnet, med alt samlet.
# Haster det (f.eks. en feil som ødelegger noe): kjør jobben manuelt under
# Actions → Release → Run workflow, så går den ut med en gang.
on:
  schedule:
    # GitHub bruker UTC: 01:00 UTC = 03:00 sommertid, 02:00 UTC = 03:00 vintertid
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Les versjon
        id: v
        run: |
          # planlagte kjøringer: bare rundt 03:00 i Norge (den andre cron-tiden hoppes over)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            H=$(TZ=Europe/Oslo date +%H)
            if [ "$H" -lt 3 ] || [ "$H" -gt 5 ]; then
              echo "Klokka er $H i Norge – venter til 03:00."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          VERSION="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION finnes allerede – hopper over."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bygg zip
        if: steps.v.outputs.skip != 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          mkdir -p .release/Chillan
          rsync -a --exclude '.git*' --exclude '.github' --exclude '.release' \
            --exclude 'README.md' --exclude 'VERSION' --exclude '.pkgmeta' ./ .release/Chillan/
          sed -i "s/@project-version@/${TAG#v}/" .release/Chillan/*.toc
          cd .release
          # Samme innhold i to navn: "-forever" for WowUp som kjenner Forever,
          # og uten suffiks for WowUp som tror Forever-mappen er Retail.
          zip -r -q "Chillan-${TAG}-forever.zip" Chillan
          cp "Chillan-${TAG}-forever.zip" "Chillan-${TAG}.zip"
          cat > release.json <<JSON
          {"releases":[
            {"name":"Chillan","version":"${TAG}","filename":"Chillan-${TAG}-forever.zip","nolib":false,"metadata":[{"flavor":"forever","interface":16001}]},
            {"name":"Chillan","version":"${TAG}","filename":"Chillan-${TAG}.zip","nolib":false,"metadata":[{"flavor":"mainline","interface":16001}]}
          ]}
          JSON
          ls -la

      - name: Publiser release
        if: steps.v.outputs.skip != 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" .release/Chillan-${TAG}-forever.zip .release/Chillan-${TAG}.zip .release/release.json \
            --title "Chillan? ${TAG}" --notes "Oppdater i WowUp, eller last ned zip-filen og legg mappen Chillan i _forever_\\Interface\\AddOns." \
            --verify-tag
