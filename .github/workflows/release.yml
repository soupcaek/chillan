name: Release

# Nightly release: change the number in VERSION (e.g. 1.0.1) and push to main as often as you like.
# At 03:00 Norwegian time this job checks whether VERSION already has a release; if not, it runs the
# tests, builds the zip and publishes it as a GitHub release, which WowUp picks up. So the gang gets
# at most one update a day. Urgent (a Lua error that breaks something): run it by hand under
# Actions → Release → Run workflow. A failing test stops the release.
#
# Version naming (1.0.0 on): tag, release title and release.json all carry the bare version
# ("1.0.0"), so WowUp shows just the number.
on:
  schedule:
    # GitHub bruker UTC: 01:00 UTC = 03:00 sommertid, 02:00 UTC = 03:00 vintertid
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          # planlagte kjøringer: bare rundt 03:00 i Norge (den andre cron-tiden hoppes over)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            H=$(TZ=Europe/Oslo date +%H)
            if [ "$H" -lt 3 ] || [ "$H" -gt 5 ]; then
              echo "It's $H o'clock in Norway – waiting for 03:00."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists – skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests (syntax + sims)
        if: steps.v.outputs.skip != 'true'
        run: |
          pip install --quiet lupa
          python3 tests/run_all.py

      - name: Build zip
        if: steps.v.outputs.skip != 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          mkdir -p .release/Chillan
          rsync -a --exclude '.git*' --exclude '.github' --exclude '.release' \
            --exclude 'README.md' --exclude 'VERSION' --exclude '.pkgmeta' --exclude 'ChillanDungeonJournal' --exclude 'discord' --exclude 'brand' --exclude '.previews' --exclude 'tests' --exclude 'LES MEG.txt' ./ .release/Chillan/
          sed -i "s/@project-version@/${TAG}/" .release/Chillan/*.toc
          # the Discord companion rides along, so every gang member already has it
          mkdir -p .release/Chillan/Companion
          gh release download companion -p ChillanCompanion.exe -p version.txt -D .release/Chillan/Companion || echo "no companion release yet"
          cd .release
          # Same content under two names: "-forever" for WowUp builds that know Forever,
          # and without the suffix for WowUp builds that take the Forever folder for Retail.
          zip -r -q "Chillan-${TAG}-forever.zip" Chillan
          cp "Chillan-${TAG}-forever.zip" "Chillan-${TAG}.zip"
          cat > release.json <<JSON
          {"releases":[
            {"name":"Chillan","version":"${TAG}","filename":"Chillan-${TAG}-forever.zip","nolib":false,"metadata":[{"flavor":"forever","interface":16001}]},
            {"name":"Chillan","version":"${TAG}","filename":"Chillan-${TAG}.zip","nolib":false,"metadata":[{"flavor":"mainline","interface":16001}]}
          ]}
          JSON
          ls -la

      - name: Publish release
        if: steps.v.outputs.skip != 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" .release/Chillan-${TAG}-forever.zip .release/Chillan-${TAG}.zip .release/release.json \
            --title "${TAG}" --notes "Update in WowUp, or download the zip and put the Chillan folder in _forever_\\Interface\\AddOns." \
            --verify-tag
