# Builds the Chillan companion (Windows .exe) and publishes it as the "companion" release.
name: Companion build
on:
  push:
    branches: [main]
    paths: ["discord/companion/**", ".github/workflows/companion.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r discord/companion/requirements.txt pyinstaller
      - name: Build
        working-directory: discord/companion
        run: pyinstaller --noconfirm --onefile --windowed --name ChillanCompanion chillan_companion.py
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          grep -oP 'VERSION = "\K[0-9.]+' discord/companion/chillan_companion.py > discord/companion/dist/version.txt
          gh release delete companion --yes --cleanup-tag || true
          gh release create companion discord/companion/dist/ChillanCompanion.exe discord/companion/dist/version.txt \
            --title "Chillan companion (Windows)" --prerelease \
            --notes "Relays Chillan? events from WoW to Discord. Download ChillanCompanion.exe, run it, paste the raw-channel webhook. Windows may warn because the program isn't signed: More info → Run anyway."
